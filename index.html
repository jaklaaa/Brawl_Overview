<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRAWL STATS SSS — Meta Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f1a;
  --panel: #131629;
  --border: #1e2540;
  --accent: #f7c948;
  --accent2: #3bf0c4;
  --text: #e8eaf6;
  --muted: #5c6bc0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; overflow-x: hidden; }

/* ── HEADER ── */
.header {
  background: linear-gradient(135deg, #1a1f3a 0%, #0d1020 100%);
  border-bottom: 2px solid var(--accent);
  padding: 14px 24px;
  display: flex; align-items: center; gap: 20px;
  position: sticky; top: 0; z-index: 200;
  box-shadow: 0 4px 30px rgba(247,201,72,0.15);
}
.logo { font-size: 26px; font-weight: 700; letter-spacing: 2px; color: var(--accent); text-shadow: 0 0 20px rgba(247,201,72,0.5); }
.logo span { color: var(--accent2); }
.last-updated {
  margin-left: auto; font-family: 'Share Tech Mono', monospace;
  font-size: 11px; color: var(--muted);
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 4px; padding: 4px 10px;
}
.last-updated span { color: var(--accent2); }

/* ── META NAV (pill-style card tabs) ── */
.meta-nav {
  display: flex; gap: 10px; padding: 14px 24px;
  background: #080b15;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 58px; z-index: 150;
  overflow-x: auto;
}
.meta-nav::-webkit-scrollbar { height: 0; }

.meta-tab {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px; cursor: pointer;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: rgba(255,255,255,0.025);
  transition: all 0.2s ease;
  white-space: nowrap;
  user-select: none;
  flex-shrink: 0;
}
.meta-tab:hover { border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); }

.meta-tab .mt-icon {
  font-size: 20px;
  line-height: 1;
}
.meta-tab .mt-label {
  font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
  color: var(--muted); text-transform: uppercase;
  transition: color 0.2s;
}
.meta-tab .mt-sub {
  font-size: 10px; font-family: 'Share Tech Mono', monospace;
  color: #3a4060; margin-top: 1px;
  transition: color 0.2s;
}

.meta-tab.active[data-tab="pro"] {
  background: rgba(247,201,72,0.08);
  border-color: rgba(247,201,72,0.45);
}
.meta-tab.active[data-tab="pro"] .mt-label { color: var(--accent); }
.meta-tab.active[data-tab="pro"] .mt-sub   { color: rgba(247,201,72,0.5); }

.meta-tab.active[data-tab="longterm"] {
  background: rgba(167,139,250,0.08);
  border-color: rgba(167,139,250,0.45);
}
.meta-tab.active[data-tab="longterm"] .mt-label { color: #a78bfa; }
.meta-tab.active[data-tab="longterm"] .mt-sub   { color: rgba(167,139,250,0.5); }

.meta-tab.active[data-tab="gamemodes"] {
  background: rgba(251,146,60,0.08);
  border-color: rgba(251,146,60,0.45);
}
.meta-tab.active[data-tab="gamemodes"] .mt-label { color: #fb923c; }
.meta-tab.active[data-tab="gamemodes"] .mt-sub   { color: rgba(251,146,60,0.5); }

/* ── PAGES ── */
.page { display: none; padding: 24px; }
.page.active { display: block; }

/* ── PRO STATS BANNER ── */
.pro-stats-banner {
  display: flex; align-items: center; gap: 20px;
  padding: 14px 20px; margin-bottom: 20px;
  background: linear-gradient(135deg, rgba(247,201,72,0.06), rgba(59,240,196,0.03));
  border: 1px solid rgba(247,201,72,0.2);
  border-radius: 12px;
  flex-wrap: wrap;
}
.psb-stat {
  display: flex; flex-direction: column; align-items: center;
  min-width: 90px; padding: 0 12px;
  border-right: 1px solid var(--border);
}
.psb-stat:last-child { border-right: none; }
.psb-val {
  font-size: 28px; font-weight: 700;
  font-family: 'Share Tech Mono', monospace;
  color: var(--accent);
  text-shadow: 0 0 12px rgba(247,201,72,0.3);
}
.psb-label {
  font-size: 10px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--muted);
  margin-top: 2px;
}
.psb-divider { flex: 1; }

/* ── GAMEMODE SWITCHER BAR ── */
.gm-switcher {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 18px; padding: 10px 14px;
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border); border-radius: 10px;
}
.gm-switch-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
  cursor: pointer;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0;
  transition: all 0.15s;
}
.gm-switch-btn:hover { border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); }
.gm-switch-btn.active { box-shadow: 0 0 12px rgba(255,255,255,0.05); }
.gm-switch-icon img {
  width: 56px; height: 56px;
  object-fit: contain; display: block;
}
.gm-tier-section { display: none; }
.gm-tier-section.active { display: block; }
.gm-section-header {
  font-size: 11px; letter-spacing: 2px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 14px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.gm-section-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* ── TIER ROWS ── */
.tier-row {
  display: flex; align-items: stretch; margin-bottom: 6px;
  border-radius: 8px; border: 1px solid var(--border); min-height: 80px;
}
.tier-label {
  width: 64px; min-width: 64px; display: flex; align-items: center; justify-content: center;
  font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 700;
  letter-spacing: 2px; color: #000; flex-shrink: 0; border-radius: 7px 0 0 7px;
}
.tier-S { background: #ff4e50; }
.tier-A { background: #ff9800; }
.tier-B { background: #ffeb3b; }
.tier-C { background: #8bc34a; }
.tier-D { background: #29b6f6; }
.tier-F { background: #9e9e9e; }
.tier-unranked { background: #1a1a2e; color: var(--muted); font-size: 10px; letter-spacing: 1px; text-align: center; padding: 4px; line-height: 1.4; }
.tier-brawlers {
  flex: 1; display: flex; flex-wrap: wrap; align-items: center;
  gap: 6px; padding: 8px 12px;
  background: rgba(255,255,255,0.02); border-radius: 0 7px 7px 0;
}
.empty-tier { color: var(--border); font-size: 13px; font-style: italic; padding: 4px 8px; }

/* ── BRAWLER CARDS ── */
.brawler-card {
  display: flex; flex-direction: column; align-items: center;
  width: 70px; cursor: pointer; position: relative;
  overflow: visible; transition: transform 0.15s; text-decoration: none;
}
.brawler-card:hover { transform: translateY(-4px); }
.brawler-card img {
  width: 60px; height: 60px; object-fit: cover;
  border-radius: 8px; border: 2px solid rgba(255,255,255,0.1);
  background: #1a1f3a;
}
.bc-name {
  font-size: 9px; font-family: 'Share Tech Mono', monospace;
  color: var(--muted); text-align: center; margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
}
.bc-score {
  font-size: 8px; font-family: 'Share Tech Mono', monospace;
  color: var(--accent2); text-align: center;
}

/* ── TOOLTIP ── */
.brawler-card .bc-tooltip { display: none !important; }
.bc-tooltip {
  display: none; position: fixed;
  background: #1a1f3a; border: 1px solid var(--accent);
  border-radius: 6px; padding: 8px 12px;
  white-space: nowrap; font-size: 11px;
  font-family: 'Share Tech Mono', monospace; color: var(--text);
  z-index: 999999 !important; pointer-events: none;
  min-width: 180px; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
.tt-name { color: var(--accent); font-size: 13px; font-weight: 700; margin-bottom: 5px; }
.tt-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 2px; }
.tt-label { color: var(--muted); }
.tt-val { color: var(--accent2); }

/* ── MOVEMENT BADGES ── */
.bc-badge {
  position: absolute; top: 2px; right: 2px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px; font-family: 'Share Tech Mono', monospace;
  font-size: 8px; font-weight: 700; line-height: 1; padding: 2px 3px;
  pointer-events: none; z-index: 2;
}
.bc-badge-up   { background: rgba(0,200,100,0.20); border: 1px solid rgba(0,200,100,0.5); color: #2ddb8a; }
.bc-badge-down { background: rgba(239,83,80,0.20); border: 1px solid rgba(239,83,80,0.5); color: #ef6e6b; }
.bc-badge-new  { background: rgba(247,201,72,0.20); border: 1px solid rgba(247,201,72,0.5); color: #f7c948; font-size: 7px; letter-spacing: 0.5px; }
.badge-arrow   { display: inline-block; width: 8px; height: 8px; }

/* ── LONGTERM ── */
.longterm-header {
  border-radius: 10px; padding: 16px 20px; margin-bottom: 20px;
  background: linear-gradient(135deg, rgba(167,139,250,0.08), rgba(59,240,196,0.04));
  border: 1px solid rgba(167,139,250,0.25);
}
.longterm-header h2 { font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #a78bfa; margin-bottom: 6px; }
.longterm-header p  { font-size: 13px; color: var(--muted); font-family: 'Share Tech Mono', monospace; line-height: 1.6; }
.lt-legend {
  display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
  padding: 10px 14px; background: rgba(255,255,255,0.02);
  border: 1px solid var(--border); border-radius: 6px;
}
.lt-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: 'Share Tech Mono', monospace; color: var(--muted); }
.lt-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

    C:['BROCK', 'KAZE', 'LILY', 'SIRIUS', 'SURGE', 'BYRON', 'GRAY', 'STU', 'FANG', 'SPIKE', 'ALLI', 'JESSIE', 'PENNY'],
    D:['SHELLY', 'TRUNK', 'MINA', 'BUZZ', 'BELLE', 'LUMI', 'MANDY', 'JANET'],
    F:['OTIS', 'NAJIA', 'NANI', 'BONNIE', 'COLETTE', 'NITA'],
  },
};

const GM_SWITCHER_ORDER = ['bounty','brawlBall','gemGrab','heist','hotZone','knockout','soloShowdown','brawlArena'];
const TIER_KEYS  = ['S','A','B','C','D','F'];
const TIER_ORDER = ['S','A','B','C','D','F'];
const GM_ORDER   = ['bounty','brawlBall','gemGrab','heist','hotZone','knockout'];

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function portraitUrl(n) { return 'portraits/' + n.toLowerCase() + '_portrait.jpg'; }
function wrClass(r) { return r >= 0.55 ? 'wr-high' : r >= 0.45 ? 'wr-mid' : 'wr-low'; }

function buildStatsMapFromStarting() {
  // Aggregate per brawler: total sets (wins+losses), total wins
  const m = new Map();
  for (const row of STARTING_DATA) {
    const key = row.brawler;
    if (!m.has(key)) m.set(key, { sets: 0, wins: 0 });
    const d = m.get(key);
    d.sets += row.wins + row.losses;
    d.wins += row.wins;
  }
  return m;
}

function buildStatsMapForGamemode(gm) {
  const m = new Map();
  for (const row of STARTING_DATA) {
    if (row.gamemode !== gm) continue;
    const key = row.brawler;
    if (!m.has(key)) m.set(key, { sets: 0, wins: 0 });
    const d = m.get(key);
    d.sets += row.wins + row.losses;
    d.wins += row.wins;
  }
  return m;
}

function buildTierMap(tiers) {
  const m = {};
  for (const [t,ns] of Object.entries(tiers)) for (const n of ns) m[n] = t;
  return m;
}

function getMovement(name, currentTier) {
  const prev = buildTierMap(PREV_LIST);
  if (!prev[name]) return 'new';
  if (prev[name] === currentTier) return null;
  return TIER_ORDER.indexOf(currentTier) < TIER_ORDER.indexOf(prev[name]) ? 'up' : 'down';
}

function badgeHTML(mv) {
  if (!mv) return '';
  if (mv==='up')   return `<div class="bc-badge bc-badge-up"><svg class="badge-arrow" viewBox="0 0 8 8" fill="none"><path d="M4 7V1M4 1L1.5 3.5M4 1L6.5 3.5" stroke="#2ddb8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
  if (mv==='down') return `<div class="bc-badge bc-badge-down"><svg class="badge-arrow" viewBox="0 0 8 8" fill="none"><path d="M4 1V7M4 7L1.5 4.5M4 7L6.5 4.5" stroke="#ef6e6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
  if (mv==='new')  return `<div class="bc-badge bc-badge-new">NEW</div>`;
  return '';
}

function renderTierRows(container, tiersObj, opts={}) {
  const { badges=false, longTermTrend=false, gamemodeKey=null } = opts;
  const overallStats  = buildStatsMapFromStarting();
  const prevMap       = buildTierMap(PREV_LIST);
  const currMap       = buildTierMap(PRO_MANUAL_TIERS);
  const noData        = gamemodeKey && (gamemodeKey === 'soloShowdown' || gamemodeKey === 'brawlArena');
  const gmStats       = (!noData && gamemodeKey) ? buildStatsMapForGamemode(gamemodeKey) : null;

  for (const tk of TIER_KEYS) {
    const names = tiersObj[tk] || [];
    const row = document.createElement('div');
    row.className = 'tier-row';
    row.innerHTML = `<div class="tier-label tier-${tk}">${tk}</div>`;
    const inner = document.createElement('div');
    inner.className = 'tier-brawlers';
    if (!names.length) { inner.innerHTML = '<span class="empty-tier">—</span>'; }
    else {
      for (const name of names) {
        let wrStr = '—', setsStr = '—';
        if (!noData && gamemodeKey && gmStats) {
          const gd = gmStats.get(name);
          if (gd && gd.sets > 0) { setsStr = gd.sets; wrStr = (gd.wins/gd.sets*100).toFixed(1)+'%'; }
        } else if (!gamemodeKey) {
          const s = overallStats.get(name) || { sets:0, wins:0 };
          setsStr = s.sets;
          wrStr   = s.sets > 0 ? (s.wins/s.sets*100).toFixed(1)+'%' : '—';
        }
        const mv = badges ? getMovement(name, tk) : null;
        let extra = '';
        if (badges) {
          const prev  = prevMap[name]||'—';
          const label = mv==='up' ? `↑ Up from ${prev}` : mv==='down' ? `↓ Down from ${prev}` : mv==='new' ? '✦ New' : 'Stable';
          extra = `<div class="tt-row"><span class="tt-label">Change</span><span class="tt-val">${label}</span></div>`;
        }
        if (longTermTrend) {
          const ct = currMap[name]; let note='Not in current list', col='var(--muted)';
          if (ct) {
            const li=TIER_ORDER.indexOf(tk), ci=TIER_ORDER.indexOf(ct);
            if (ci<li){note=`↑ Rising (now ${ct})`;col='#2ddb8a';}
            else if(ci>li){note=`↓ Falling (now ${ct})`;col='#ef6e6b';}
            else{note=`Stable at ${ct}`;}
          }
          extra = `<div class="tt-row"><span class="tt-label">Trend</span><span class="tt-val" style="color:${col}">${note}</span></div>`;
        }
        const statsRows = noData ? '' : `
          <div class="tt-row"><span class="tt-label">Win Rate</span><span class="tt-val">${wrStr}</span></div>
          <div class="tt-row"><span class="tt-label">Sets</span><span class="tt-val">${setsStr}</span></div>`;
        inner.innerHTML += `<a class="brawler-card" href="pages/${name.toLowerCase()}.html" style="text-decoration:none">
          ${badgeHTML(mv)}
          <img src="${portraitUrl(name)}" alt="${name}" onerror="this.style.background='#1a1f3a'">
          <div class="bc-name">${name}</div>
          <div class="bc-tooltip">
            <div class="tt-name">${name}</div>
            ${statsRows}
            ${extra}
          </div>
        </a>`;
      }
    }
    row.appendChild(inner);
    container.appendChild(row);
  }
}

// ─── TOTAL SETS BANNER ───────────────────────────────────────────────────────
function computeTotalSets() {
  let rawSets = 0;
  for (const row of STARTING_DATA) rawSets += row.wins + row.losses;
  return Math.round(rawSets / 6);
}

function computeTotalWins() {
  let wins = 0, losses = 0;
  for (const row of STARTING_DATA) { wins += row.wins; losses += row.losses; }
  return { wins, losses, sets: Math.round((wins + losses) / 6) };
}

// ─── PRO TIER LIST ───────────────────────────────────────────────────────────
function buildProTierList() {
  const container = document.getElementById('pro-tier-list');
  container.innerHTML = '';

  // Stats banner
  const { wins, losses, sets } = computeTotalWins();
  const wr = ((wins / (wins + losses)) * 100).toFixed(1);
  const banner = document.createElement('div');
  banner.className = 'pro-stats-banner';
  banner.innerHTML = `
    <div class="psb-stat">
      <div class="psb-val">${sets.toLocaleString()}</div>
      <div class="psb-label">Total Sets</div>
    </div>
    
   <div class="psb-stat">
  <div class="psb-val" style="color: #00FF00;">${LAST_UPDATED}</div>
  <div class="psb-label">Last Updated</div>
</div>
  `;
  container.appendChild(banner);

  const overallStats = buildStatsMapFromStarting();
  renderTierRows(container, PRO_MANUAL_TIERS, { badges: true });

  // Unranked
  const placed   = new Set(Object.values(PRO_MANUAL_TIERS).flat());
  const allNames = [...new Set(STARTING_DATA.map(r => r.brawler))];
  const unranked = allNames.filter(n => !placed.has(n));
  if (unranked.length) {
    const urow = document.createElement('div'); urow.className = 'tier-row';
    const ul   = document.createElement('div'); ul.className = 'tier-label tier-unranked'; ul.innerHTML = 'UNRANKED<br>/NO DATA';
    urow.appendChild(ul);
    const ui   = document.createElement('div'); ui.className = 'tier-brawlers';
    for (const name of unranked) {
      const s  = overallStats.get(name) || { sets:0, wins:0 };
      const wr2 = s.sets > 0 ? (s.wins/s.sets*100).toFixed(1)+'%' : '—';
      ui.innerHTML += `<a class="brawler-card" href="pages/${name.toLowerCase()}.html" style="text-decoration:none;opacity:0.45">
        <img src="${portraitUrl(name)}" alt="${name}" onerror="this.style.background='#1a1f3a'">
        <div class="bc-name">${name}</div>
        <div class="bc-tooltip"><div class="tt-name">${name}</div>
          <div class="tt-row"><span class="tt-label">Win Rate</span><span class="tt-val">${wr2}</span></div></div>
      </a>`;
    }
    urow.appendChild(ui); container.appendChild(urow);
  }
}

// ─── LONGTERM PAGE ────────────────────────────────────────────────────────────
function buildLongtermPage() {
  const c = document.getElementById('longterm-content');
  c.innerHTML = `<div class="longterm-header"><h2>PAST 6 MONTHS — META OVERVIEW</h2>
    <p>Sustained performance across all patches. Ranked on consistency, not just current patch.</p></div>
    <div class="lt-legend">
      <div class="lt-legend-item"><div class="lt-dot" style="background:#ff4e50"></div>S — Always meta</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#ff9800"></div>A — Consistently meta</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#ffeb3b"></div>B — Often Good</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#8bc34a"></div>C — Situational</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#29b6f6"></div>D — Rarely viable</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#9e9e9e"></div>F — Not viable</div>
    </div>`;
  const wrap = document.createElement('div');
  renderTierRows(wrap, LONGTERM_TIERS, { longTermTrend: true });
  c.appendChild(wrap);
}

// ─── GAMEMODES PAGE ───────────────────────────────────────────────────────────
function buildGamemodesPage() {
  const c = document.getElementById('gamemodes-content');
  c.innerHTML = `<div class="longterm-header"><h2>GAMEMODES — META OVERVIEW</h2>
    <p>This list highlights the strongest brawlers for each gamemode. It doesn't include every brawler. Only the ones that are consistently viable. Brawlers shown here significantly outperform those not listed, so picking outside this list is generally not recommended.</p></div>
    <div class="lt-legend">
      <div class="lt-legend-item"><div class="lt-dot" style="background:#ff4e50"></div>S — Overpowered</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#ff9800"></div>A — Top Tier</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#ffeb3b"></div>B — Strong Picks</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#8bc34a"></div>C — Solid</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#29b6f6"></div>D — Niche</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#9e9e9e"></div>F — Very Niche</div>
    </div>`;

  const bar = document.createElement('div');
  bar.className = 'gm-switcher';

  GM_SWITCHER_ORDER.forEach((key, i) => {
    const gm  = GAMEMODE_TIERS[key];
    const btn = document.createElement('div');
    btn.className = 'gm-switch-btn' + (i===0?' active':'');
    if (i===0) { btn.style.background = gm.color+'22'; btn.style.borderColor = gm.color+'66'; }
    btn.innerHTML = `<span class="gm-switch-icon"><img src="${gm.icon}" alt="${gm.label}" /></span>`;
    btn.title = gm.label;
    btn.onclick = () => {
      document.querySelectorAll('.gm-switch-btn').forEach(b => { b.classList.remove('active'); b.style.background=''; b.style.borderColor=''; });
      btn.classList.add('active');
      btn.style.background   = gm.color+'22';
      btn.style.borderColor  = gm.color+'66';
      document.querySelectorAll('.gm-tier-section').forEach(s => s.classList.remove('active'));
      document.getElementById('gms-'+key).classList.add('active');
    };
    bar.appendChild(btn);
  });
  c.appendChild(bar);

  GM_SWITCHER_ORDER.forEach((key, i) => {
    const gm  = GAMEMODE_TIERS[key];
    const sec = document.createElement('div');
    sec.className = 'gm-tier-section' + (i===0?' active':'');
    sec.id = 'gms-' + key;
    const hdr = document.createElement('div');
    hdr.className = 'gm-section-header';
    hdr.innerHTML = `<div class="gm-section-dot" style="background:${gm.color}"></div>${gm.label.toUpperCase()} TIER LIST`;
    sec.appendChild(hdr);
    renderTierRows(sec, gm, { gamemodeKey: key });
    c.appendChild(sec);
  });
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.getElementById('last-updated-date').textContent = LAST_UPDATED;
buildProTierList();
buildLongtermPage();
buildGamemodesPage();

// ─── FLOATING TOOLTIP ────────────────────────────────────────────────────────
const floatingTip = document.createElement('div');
floatingTip.className = 'bc-tooltip';
floatingTip.style.display = 'none';
floatingTip.style.position = 'fixed';
document.body.appendChild(floatingTip);

document.addEventListener('mouseover', e => {
  const card = e.target.closest('.brawler-card');
  if (!card) { floatingTip.style.display = 'none'; return; }
  const tip = card.querySelector('.bc-tooltip');
  if (!tip) return;
  floatingTip.innerHTML = tip.innerHTML;
  floatingTip.style.display = 'block';
  positionTip(e, floatingTip);
});
document.addEventListener('mouseout', e => {
  const card = e.target.closest('.brawler-card');
  if (!card) return;
  if (!e.relatedTarget || !e.relatedTarget.closest('.brawler-card')) floatingTip.style.display = 'none';
});
document.addEventListener('mousemove', e => {
  if (floatingTip.style.display === 'block') positionTip(e, floatingTip);
});
function positionTip(e, tip) {
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = e.clientX + 12, top = e.clientY + 12;
  if (left + tw > window.innerWidth)  left = e.clientX - tw - 8;
  if (top  + th > window.innerHeight) top  = e.clientY - th - 8;
  tip.style.left = left + 'px';
  tip.style.top  = top  + 'px';
}
</script>
</body>
</html>
