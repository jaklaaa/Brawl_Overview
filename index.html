<style>
:root {
  --bg: #0d0f1a;
  --panel: #131629;
  --border: #1e2540;
  --accent: #f7c948;
  --accent2: #3bf0c4;
  --text: #e8eaf6;
  --muted: #5c6bc0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; overflow-x: hidden; }

.header {
  background: linear-gradient(135deg, #1a1f3a 0%, #0d1020 100%);
  border-bottom: 2px solid var(--accent);
  padding: 14px 24px;
  display: flex; align-items: center; gap: 20px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 4px 30px rgba(247,201,72,0.15);
}
.logo { font-size: 26px; font-weight: 700; letter-spacing: 2px; color: var(--accent); text-shadow: 0 0 20px rgba(247,201,72,0.5); }
.logo span { color: var(--accent2); }
.last-updated {
  margin-left: auto; font-family: 'Share Tech Mono', monospace;
  font-size: 11px; color: var(--muted);
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 4px; padding: 4px 10px;
}
.last-updated span { color: var(--accent2); }

.top-nav {
  display: flex; background: #080a12;
  border-bottom: 1px solid var(--border);
  padding: 0 24px; overflow-x: auto;
}
.top-tab {
  padding: 10px 22px; cursor: pointer; font-family: 'Rajdhani', sans-serif;
  font-weight: 700; font-size: 14px; letter-spacing: 1.5px;
  color: var(--muted); border-bottom: 2px solid transparent;
  transition: all 0.2s; white-space: nowrap;
}
.top-tab:hover { color: var(--text); }
.top-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.top-tab[data-page="jasper"].active  { color: #ff6ec7; border-bottom-color: #ff6ec7; }
.top-tab[data-page="daniel"].active  { color: #64b5f6; border-bottom-color: #64b5f6; }
.top-tab[data-page="wolf"].active    { color: #ffb74d; border-bottom-color: #ffb74d; }
.top-tab[data-page="tykoro"].active  { color: #81c784; border-bottom-color: #81c784; }
.top-tab[data-page="sirito"].active  { color: #ce93d8; border-bottom-color: #ce93d8; }

.page { display: none; padding: 24px; }
.page.active { display: block; }

.tier-row {
  display: flex; align-items: stretch; margin-bottom: 6px;
  border-radius: 8px; border: 1px solid var(--border); min-height: 80px;
}
.tier-label {
  width: 64px; min-width: 64px; display: flex; align-items: center; justify-content: center;
  font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 700;
  letter-spacing: 2px; color: #000; flex-shrink: 0; border-radius: 7px 0 0 7px;
}
.tier-S { background: #ff4e50; }
.tier-A { background: #ff9800; }
.tier-B { background: #ffeb3b; }
.tier-C { background: #8bc34a; }
.tier-D { background: #29b6f6; }
.tier-F { background: #9e9e9e; }
.tier-unranked { background: #1a1a2e; color: var(--muted); font-size: 10px; letter-spacing: 1px; text-align: center; padding: 4px; line-height: 1.4; }
.tier-brawlers {
  flex: 1; display: flex; flex-wrap: wrap; align-items: center;
  gap: 6px; padding: 8px 12px;
  background: rgba(255,255,255,0.02); border-radius: 0 7px 7px 0;
}
.empty-tier { color: var(--border); font-size: 13px; font-style: italic; padding: 4px 8px; }

.brawler-card {
  display: flex; flex-direction: column; align-items: center;
  width: 70px; cursor: pointer; transition: transform 0.15s;
  position: relative;
}
.brawler-card:hover { transform: translateY(-4px); }
.brawler-card img {
  width: 60px; height: 60px; object-fit: cover; border-radius: 8px;
  border: 2px solid rgba(255,255,255,0.1); background: #1a1f3a;
}
.brawler-card .bc-name {
  font-size: 9px; font-family: 'Share Tech Mono', monospace;
  color: var(--muted); text-align: center; margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
}
.brawler-card .bc-score {
  font-size: 8px; font-family: 'Share Tech Mono', monospace; color: var(--accent2); text-align: center;
}
.brawler-card:hover .bc-tooltip { display: block; }
.bc-tooltip {
  display: none; position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  background: #1a1f3a; border: 1px solid var(--accent);
  border-radius: 6px; padding: 8px 12px; white-space: nowrap;
  font-size: 11px; font-family: 'Share Tech Mono', monospace;
  color: var(--text); z-index: 9999; pointer-events: none; min-width: 180px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
.bc-tooltip .tt-name { color: var(--accent); font-size: 13px; font-weight: 700; margin-bottom: 5px; }
.bc-tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 2px; }
.bc-tooltip .tt-label { color: var(--muted); }
.bc-tooltip .tt-val { color: var(--accent2); }

.player-header {
  border-radius: 10px; padding: 18px 22px; margin-bottom: 22px;
  background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  border: 1px solid var(--border);
}
.player-header h2 { font-size: 26px; font-weight: 700; letter-spacing: 2px; margin-bottom: 12px; }
.player-stats-row { display: flex; gap: 12px; flex-wrap: wrap; }
.pstat {
  background: rgba(0,0,0,0.3); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 16px; text-align: center; min-width: 80px;
}
.pstat .ps-val { font-size: 20px; font-weight: 700; font-family: 'Share Tech Mono', monospace; color: var(--accent2); }
.pstat .ps-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

.section-header {
  font-size: 11px; letter-spacing: 2px; color: var(--muted);
  text-transform: uppercase; margin: 28px 0 14px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
}

.gm-accordion { margin-bottom: 6px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.gm-accordion-header {
  display: flex; align-items: center; gap: 12px; padding: 11px 16px;
  background: rgba(255,255,255,0.03); cursor: pointer;
  user-select: none; transition: background 0.15s;
}
.gm-accordion-header:hover { background: rgba(255,255,255,0.06); }
.gm-dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
.gm-acc-title { font-size: 15px; font-weight: 700; letter-spacing: 1px; flex: 1; }
.gm-acc-meta { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--muted); display: flex; gap: 14px; }
.gm-acc-wr {
  font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: 700;
  padding: 2px 8px; border-radius: 4px; background: rgba(0,0,0,0.3); min-width: 42px; text-align: center;
}
.gm-acc-arrow { font-size: 11px; color: var(--muted); transition: transform 0.2s; margin-left: 6px; }
.gm-accordion.open .gm-acc-arrow { transform: rotate(90deg); }
.gm-accordion-body { display: none; border-top: 1px solid var(--border); }
.gm-accordion.open .gm-accordion-body { display: block; }

.map-group { border-bottom: 1px solid rgba(255,255,255,0.04); }
.map-group:last-child { border-bottom: none; }
.map-group-header {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 38px;
  background: rgba(0,0,0,0.2); cursor: pointer; user-select: none;
  transition: background 0.15s;
}
.map-group-header:hover { background: rgba(255,255,255,0.04); }
.map-group-name { flex: 1; color: var(--text); font-size: 13px; font-weight: 600; }
.map-group-record { font-family: 'Share Tech Mono', monospace; font-size: 11px; display: flex; gap: 6px; align-items: center; }
.map-group-arrow { font-size: 10px; color: var(--muted); transition: transform 0.2s; margin-left: 8px; }
.map-group.open .map-group-arrow { transform: rotate(90deg); }
.map-group-body { display: none; }
.map-group.open .map-group-body { display: block; }

.brawler-result-row {
  display: flex; align-items: center; gap: 10px; padding: 7px 16px 7px 52px;
  border-top: 1px solid rgba(255,255,255,0.03); font-size: 13px;
  transition: background 0.1s;
}
.brawler-result-row:hover { background: rgba(255,255,255,0.03); }
.brr-img { width: 26px; height: 26px; border-radius: 4px; object-fit: cover; background: #1a1f3a; flex-shrink: 0; }
.brr-name { font-weight: 700; flex: 1; }
.brr-record { font-family: 'Share Tech Mono', monospace; font-size: 12px; }
.brr-win { color: #4caf50; }
.brr-loss { color: #ef5350; }
.brr-wr { font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: rgba(0,0,0,0.3); min-width: 42px; text-align: center; }
.wr-high { color: #4caf50; }
.wr-mid  { color: var(--accent); }
.wr-low  { color: #ef5350; }

.gm-empty { padding: 10px 16px; font-size: 12px; color: var(--muted); font-family: 'Share Tech Mono', monospace; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

function portraitUrl(name) { return 'portraits/' + name.toLowerCase() + '_portrait.jpg'; }
function wrClass(r) { return r >= 0.55 ? 'wr-high' : r >= 0.45 ? 'wr-mid' : 'wr-low'; }
function score(sets, wins) {
  if (sets < 1 || wins === 0) return sets < 1 ? null : 0;
  return Math.pow(sets, 0.7) * Math.pow(wins / sets, 0.3);
}
function brawlerToPage(name) {
  return name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-]/g,'').replace(/-+/g,'-');
}

// Build a lookup of total sets/wins per brawler from PRO_DATA for tooltip use
function buildProStatsMap() {
  const map = new Map();
  for (const b of PRO_DATA) {
    let sets = 0, wins = 0;
    for (const gm of GM_ORDER) { if (b[gm]) { sets += b[gm][0]; wins += b[gm][1]; } }
    map.set(b.brawler, { sets, wins });
  }
  return map;
}

  // Unranked = in PRO_DATA but not in any manual tier
  const unranked = PRO_DATA
    .filter(b => !placed.has(b.brawler))
    .map(b => {
      const s = proStats.get(b.brawler) || { sets: 0, wins: 0 };
      return { name: b.brawler, ...s };
    });

  for (const tier of TIER_DEFS) {
    const names = PRO_MANUAL_TIERS[tier.key] || [];
    const row = document.createElement('div');
    row.className = 'tier-row';
    row.innerHTML = `<div class="tier-label tier-${tier.key}">${tier.key}</div>`;
    const inner = document.createElement('div');
    inner.className = 'tier-brawlers';

    if (!names.length) {
      inner.innerHTML = '<span class="empty-tier">—</span>';
    } else {
      for (const name of names) {
        const s = proStats.get(name) || { sets: 0, wins: 0 };
        const wr = s.sets > 0 ? (s.wins / s.sets * 100).toFixed(1) + '%' : '—';
        const page = brawlerToPage(name);
        inner.innerHTML += `<a class="brawler-card" href="pages/${page}.html?name=${encodeURIComponent(name)}&tier=${tier.key}" style="text-decoration:none">
          <img src="${portraitUrl(name)}" alt="${name}" onerror="this.style.background='#1a1f3a'">
          <div class="bc-name">${name}</div>
          <div class="bc-tooltip">
            <div class="tt-name">${name}</div>
            <div class="tt-row"><span class="tt-label">Win Rate</span><span class="tt-val">${wr}</span></div>
            <div class="tt-row"><span class="tt-label">Sets Played</span><span class="tt-val">${s.sets}</span></div>
          </div>
        </a>`;
      }
    }
    row.appendChild(inner);
    container.appendChild(row);
  }

  // Unranked row
  const urow = document.createElement('div');
  urow.className = 'tier-row';
  const ulabel = document.createElement('div');
  ulabel.className = 'tier-label tier-unranked';
  ulabel.innerHTML = 'UNRANKED<br>/NO DATA';
  urow.appendChild(ulabel);
  const uinner = document.createElement('div');
  uinner.className = 'tier-brawlers';
  if (!unranked.length) {
    uinner.innerHTML = '<span class="empty-tier">—</span>';
  } else {
    for (const b of unranked) {
      const wr = b.sets > 0 ? (b.wins / b.sets * 100).toFixed(1) + '%' : '—';
      const page = brawlerToPage(b.name);
      uinner.innerHTML += `<a class="brawler-card" href="pages/${page}.html?name=${encodeURIComponent(b.name)}&tier=UNRANKED" style="text-decoration:none;opacity:0.45">
        <img src="${portraitUrl(b.name)}" alt="${b.name}" onerror="this.style.background='#1a1f3a'">
        <div class="bc-name">${b.name}</div>
        <div class="bc-tooltip">
          <div class="tt-name">${b.name}</div>
          <div class="tt-row"><span class="tt-label">Win Rate</span><span class="tt-val">${wr}</span></div>
          <div class="tt-row"><span class="tt-label">Sets Played</span><span class="tt-val">${b.sets}</span></div>
        </div>
      </a>`;
    }
  }
  urow.appendChild(uinner);
  container.appendChild(urow);
}

// ── Player tier list still uses formula + shows scores ──
function renderPlayerTierList(container, scored, unranked) {
  const tierDefs = [
    { key:'S', pct:0.10 }, { key:'A', pct:0.25 }, { key:'B', pct:0.50 },
    { key:'C', pct:0.75 }, { key:'D', pct:0.90 }, { key:'F', pct:1.00 },
  ];
  const buckets = {};
  for (const t of tierDefs) buckets[t.key] = [];
  scored.sort((a, b) => b.score - a.score);
  const total = scored.length;
  scored.forEach((b, i) => {
    const pct = (i + 1) / total;
    const tier = tierDefs.find(t => pct <= t.pct);
    buckets[tier.key].push(b);
  });

  for (const t of tierDefs) {
    const row = document.createElement('div');
    row.className = 'tier-row';
    row.innerHTML = `<div class="tier-label tier-${t.key}">${t.key}</div>`;
    const inner = document.createElement('div');
    inner.className = 'tier-brawlers';
    const brawlers = buckets[t.key];
    if (!brawlers.length) {
      inner.innerHTML = '<span class="empty-tier">—</span>';
    } else {
      for (const b of brawlers) {
        const wr = (b.wins / b.sets * 100).toFixed(1);
        inner.innerHTML += `<div class="brawler-card">
          <img src="${portraitUrl(b.name)}" alt="${b.name}" onerror="this.style.background='#1a1f3a'">
          <div class="bc-name">${b.name}</div>
          <div class="bc-score">${b.score.toFixed(2)}</div>
          <div class="bc-tooltip">
            <div class="tt-name">${b.name}</div>
            <div class="tt-row"><span class="tt-label">Win Rate</span><span class="tt-val">${wr}%</span></div>
            <div class="tt-row"><span class="tt-label">Sets Played</span><span class="tt-val">${b.sets}</span></div>
            <div class="tt-row"><span class="tt-label">Score</span><span class="tt-val">${b.score.toFixed(2)}</span></div>
          </div>
        </div>`;
      }
    }
    row.appendChild(inner);
    container.appendChild(row);
  }

  // Unranked
  const urow = document.createElement('div');
  urow.className = 'tier-row';
  const ulabel = document.createElement('div');
  ulabel.className = 'tier-label tier-unranked';
  ulabel.innerHTML = 'UNRANKED<br>/NO DATA';
  urow.appendChild(ulabel);
  const uinner = document.createElement('div');
  uinner.className = 'tier-brawlers';
  if (!unranked.length) {
    uinner.innerHTML = '<span class="empty-tier">—</span>';
  } else {
    for (const b of unranked) {
      const wr = b.sets > 0 ? (b.wins / b.sets * 100).toFixed(1) + '%' : '—';
      uinner.innerHTML += `<div class="brawler-card" style="opacity:0.45">
        <img src="${portraitUrl(b.name)}" alt="${b.name}" onerror="this.style.background='#1a1f3a'">
        <div class="bc-name">${b.name}</div>
        <div class="bc-score">${b.sets > 0 ? b.sets+'s' : '—'}</div>
        <div class="bc-tooltip">
          <div class="tt-name">${b.name}</div>
          <div class="tt-row"><span class="tt-label">Win Rate</span><span class="tt-val">${wr}</span></div>
          <div class="tt-row"><span class="tt-label">Sets</span><span class="tt-val">${b.sets} (min 3)</span></div>
        </div>
      </div>`;
    }
  }
  urow.appendChild(uinner);
  container.appendChild(urow);
}

function buildPlayerPage(playerId) {
  const p = PLAYERS[playerId];
  const container = document.getElementById(playerId + '-content');
  container.innerHTML = '';

  const totalWins   = p.matches.reduce((s,m) => s + m.wins, 0);
  const totalLosses = p.matches.reduce((s,m) => s + m.losses, 0);
  const totalSets   = totalWins + totalLosses;
  const overallWR   = totalSets > 0 ? (totalWins / totalSets * 100).toFixed(1) : '—';
  const wrc         = totalSets > 0 ? wrClass(totalWins / totalSets) : '';

  const hdr = document.createElement('div');
  hdr.className = 'player-header';
  hdr.style.borderColor = p.color + '44';
  hdr.innerHTML = `
    <h2 style="color:${p.color}">${p.name}</h2>
    <div class="player-stats-row">
      <div class="pstat"><div class="ps-val" style="color:${p.color}">${totalSets}</div><div class="ps-label">Total Sets</div></div>
      <div class="pstat"><div class="ps-val">${totalWins}</div><div class="ps-label">Wins</div></div>
      <div class="pstat"><div class="ps-val" style="color:#ef5350">${totalLosses}</div><div class="ps-label">Losses</div></div>
      <div class="pstat"><div class="ps-val ${wrc}">${overallWR}${totalSets > 0 ? '%' : ''}</div><div class="ps-label">Win Rate</div></div>
    </div>`;
  container.appendChild(hdr);

  const gmHdr = document.createElement('div');
  gmHdr.className = 'section-header';
  gmHdr.textContent = 'Results by Game Mode & Map';
  container.appendChild(gmHdr);

  for (const gm of GM_ORDER) {
    const gmMatches = p.matches.filter(m => m.gamemode === gm);
    const gmW = gmMatches.reduce((s,m) => s + m.wins, 0);
    const gmL = gmMatches.reduce((s,m) => s + m.losses, 0);
    const gmS = gmW + gmL;
    const gmR = gmS > 0 ? gmW / gmS : null;
    const wrText = gmR !== null ? (gmR * 100).toFixed(0) + '%' : '—';
    const wrc2 = gmR !== null ? wrClass(gmR) : '';

    const acc = document.createElement('div');
    acc.className = 'gm-accordion';
    acc.innerHTML = `
      <div class="gm-accordion-header" onclick="toggleAcc(this)">
        <div class="gm-dot" style="background:${GM_COLORS[gm]}"></div>
        <div class="gm-acc-title">${GM_LABELS[gm]}</div>
        <div class="gm-acc-meta"><span>${gmS} sets</span><span>${gmW}W / ${gmL}L</span></div>
        <div class="gm-acc-wr ${wrc2}">${wrText}</div>
        <div class="gm-acc-arrow">▶</div>
      </div>
      <div class="gm-accordion-body"></div>`;

    const body = acc.querySelector('.gm-accordion-body');
    if (gmMatches.length === 0) {
      body.innerHTML = '<div class="gm-empty">No games played in this mode yet.</div>';
    } else {
      const byMap = {};
      for (const m of gmMatches) { (byMap[m.map] = byMap[m.map] || []).push(m); }
      for (const [mapName, rows] of Object.entries(byMap)) {
        const mW = rows.reduce((s,m) => s + m.wins, 0);
        const mL = rows.reduce((s,m) => s + m.losses, 0);
        const mS = mW + mL;
        const mR = mS > 0 ? mW / mS : null;
        const mg = document.createElement('div');
        mg.className = 'map-group';
        mg.innerHTML = `
          <div class="map-group-header" onclick="toggleMap(this)">
            <div class="map-group-name">${mapName}</div>
            <div class="map-group-record">
              <span style="color:#4caf50">${mW}W</span>
              <span style="color:#ef5350">${mL}L</span>
              <span style="color:var(--border)">·</span>
              <span class="${mR !== null ? wrClass(mR) : ''}">${mR !== null ? (mR*100).toFixed(0)+'%' : '—'}</span>
            </div>
            <div class="map-group-arrow">▶</div>
          </div>
          <div class="map-group-body"></div>`;
        const mgBody = mg.querySelector('.map-group-body');
        for (const m of rows) {
          const s2 = m.wins + m.losses;
          const r2 = s2 > 0 ? m.wins / s2 : null;
          mgBody.innerHTML += `
            <div class="brawler-result-row">
              <img class="brr-img" src="${portraitUrl(m.brawler)}" alt="${m.brawler}" onerror="this.style.background='#1a1f3a'">
              <div class="brr-name">${m.brawler}</div>
              <div class="brr-record"><span class="brr-win">${m.wins}W</span> <span class="brr-loss">${m.losses}L</span></div>
              <div class="brr-wr ${r2 !== null ? wrClass(r2) : ''}">${r2 !== null ? (r2*100).toFixed(0)+'%' : '—'}</div>
            </div>`;
        }
        body.appendChild(mg);
      }
    }
    container.appendChild(acc);
  }

  const tlHdr = document.createElement('div');
  tlHdr.className = 'section-header';
  tlHdr.textContent = 'Brawler Performance Tier List';
  container.appendChild(tlHdr);

  const bAgg = {};
  for (const m of p.matches) {
    if (!bAgg[m.brawler]) bAgg[m.brawler] = { wins:0, losses:0 };
    bAgg[m.brawler].wins += m.wins;
    bAgg[m.brawler].losses += m.losses;
  }
  const scored = [], unranked = [];
  for (const [name, d] of Object.entries(bAgg)) {
    const sets = d.wins + d.losses;
    const sc = sets >= 3 ? score(sets, d.wins) : null;
    if (sc !== null) scored.push({ name, sets, wins: d.wins, score: sc });
    else unranked.push({ name, sets, wins: d.wins, score: 0 });
  }
  const tlWrap = document.createElement('div');
  renderPlayerTierList(tlWrap, scored, unranked);
  container.appendChild(tlWrap);
}

function toggleAcc(h) { h.closest('.gm-accordion').classList.toggle('open'); }
function toggleMap(h) { h.closest('.map-group').classList.toggle('open'); }
function switchPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.top-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  document.querySelector('[data-page="' + id + '"]').classList.add('active');
}

document.getElementById('last-updated-date').textContent = LAST_UPDATED;
buildProTierList();
for (const id of Object.keys(PLAYERS)) buildPlayerPage(id);
</script>
</body>
