<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRAWL STATS SSS — Squad Overview</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f1a;
  --panel: #131629;
  --border: #1e2540;
  --accent: #f7c948;
  --accent2: #3bf0c4;
  --text: #e8eaf6;
  --muted: #5c6bc0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; overflow-x: hidden; }

/* ── HEADER ── */
.header {
  background: linear-gradient(135deg, #1a1f3a 0%, #0d1020 100%);
  border-bottom: 2px solid var(--accent);
  padding: 14px 24px;
  display: flex; align-items: center; gap: 20px;
  position: sticky; top: 0; z-index: 200;
  box-shadow: 0 4px 30px rgba(247,201,72,0.15);
}
.logo { font-size: 26px; font-weight: 700; letter-spacing: 2px; color: var(--accent); text-shadow: 0 0 20px rgba(247,201,72,0.5); }
.logo span { color: var(--accent2); }
.last-updated {
  margin-left: auto; font-family: 'Share Tech Mono', monospace;
  font-size: 11px; color: var(--muted);
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 4px; padding: 4px 10px;
}
.last-updated span { color: var(--accent2); }

/* ── PRIMARY NAV ── */
.primary-nav {
  display: flex; background: #060810;
  border-bottom: 2px solid var(--border);
  padding: 0 24px;
  position: sticky; top: 58px; z-index: 150;
}
.primary-tab {
  padding: 11px 30px; cursor: pointer;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700; font-size: 15px; letter-spacing: 2px;
  color: var(--muted); border-bottom: 3px solid transparent;
  transition: all 0.2s; white-space: nowrap;
  margin-bottom: -2px;
}
.primary-tab:hover { color: var(--text); }
.primary-tab.active[data-primary="meta"]  { color: var(--accent);  border-bottom-color: var(--accent); }
.primary-tab.active[data-primary="users"] { color: var(--accent2); border-bottom-color: var(--accent2); }

/* ── SECONDARY NAV ── */
.secondary-nav {
  display: none; background: #0a0c18;
  border-bottom: 1px solid var(--border);
  padding: 0 32px; overflow-x: auto;
  position: sticky; top: 103px; z-index: 140;
}
.secondary-nav.visible { display: flex; }
.secondary-tab {
  padding: 8px 16px; cursor: pointer;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700; font-size: 12px; letter-spacing: 1.5px;
  color: var(--muted); border-bottom: 2px solid transparent;
  transition: all 0.2s; white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.secondary-tab:hover { color: var(--text); }
.secondary-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.secondary-tab[data-sub="jasper"].active  { color: #ff6ec7; border-bottom-color: #ff6ec7; }
.secondary-tab[data-sub="daniel"].active  { color: #64b5f6; border-bottom-color: #64b5f6; }
.secondary-tab[data-sub="wolf"].active    { color: #ffb74d; border-bottom-color: #ffb74d; }
.secondary-tab[data-sub="tykoro"].active  { color: #81c784; border-bottom-color: #81c784; }
.secondary-tab[data-sub="sirito"].active  { color: #ce93d8; border-bottom-color: #ce93d8; }
.secondary-tab[data-sub="longterm"].active   { color: #a78bfa; border-bottom-color: #a78bfa; }
.secondary-tab[data-sub="gamemodes"].active  { color: #fb923c; border-bottom-color: #fb923c; }
.tab-pip { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }

/* ── PAGES ── */
.page { display: none; padding: 24px; }
.page.active { display: block; }

/* ── GAMEMODE SWITCHER BAR ── */
.gm-switcher {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 18px; padding: 10px 14px;
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border); border-radius: 10px;
}
.gm-switch-btn {
  display: flex;
  align-items: center;
  justify-content: center; /* center icon */
  padding: 6px; /* smaller padding */
  cursor: pointer;

  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 6px;

  /* remove text styling impact */
  font-size: 0; /* prevents spacing issues */
  gap: 0; /* remove gap since no label */
}
.gm-switch-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }
.gm-switch-icon {
  display: flex;
  align-items: center;
  justify-content: center;
}
.gm-switch-icon img {
  width: 60px;   /* smaller size */
  height: 60px;
  object-fit: contain;
  display: block;
}
.gm-tier-section { display: none; }
.gm-tier-section.active { display: block; }
.gm-section-header {
  font-size: 11px; letter-spacing: 2px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 14px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.gm-section-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* ── TIER ROWS ── */
.tier-row {
  display: flex; align-items: stretch; margin-bottom: 6px;
  border-radius: 8px; border: 1px solid var(--border); min-height: 80px;
}
.tier-label {
  width: 64px; min-width: 64px; display: flex; align-items: center; justify-content: center;
  font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 700;
  letter-spacing: 2px; color: #000; flex-shrink: 0; border-radius: 7px 0 0 7px;
}
.tier-S { background: #ff4e50; }
.tier-A { background: #ff9800; }
.tier-B { background: #ffeb3b; }
.tier-C { background: #8bc34a; }
.tier-D { background: #29b6f6; }
.tier-F { background: #9e9e9e; }
.tier-unranked { background: #1a1a2e; color: var(--muted); font-size: 10px; letter-spacing: 1px; text-align: center; padding: 4px; line-height: 1.4; }
.tier-brawlers {
  flex: 1; display: flex; flex-wrap: wrap; align-items: center;
  gap: 6px; padding: 8px 12px;
  background: rgba(255,255,255,0.02); border-radius: 0 7px 7px 0;
}
.empty-tier { color: var(--border); font-size: 13px; font-style: italic; padding: 4px 8px; }

/* ── BRAWLER CARDS ── */
.brawler-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 70px;
  cursor: pointer;
  position: relative;
  overflow: visible;
  transition: transform 0.15s;
}

.brawler-card:hover {
  transform: translateY(-4px);
}

.brawler-card img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 8px;
  border: 2px solid rgba(255,255,255,0.1);
  background: #1a1f3a;
}

.bc-name {
  font-size: 9px;
  font-family: 'Share Tech Mono', monospace;
  color: var(--muted);
  text-align: center;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
}

.bc-score {
  font-size: 8px;
  font-family: 'Share Tech Mono', monospace;
  color: var(--accent2);
  text-align: center;
}

/* ── TOOLTIP ── */
.brawler-card .bc-tooltip {
  display: none !important;
}

.bc-tooltip {
  display: none;
  position: fixed;
  background: #1a1f3a;
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 8px 12px;
  white-space: nowrap;
  font-size: 11px;
  font-family: 'Share Tech Mono', monospace;
  color: var(--text);
   z-index: 999999 !important;
  pointer-events: none;
  min-width: 180px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}

.tt-name {
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 5px;
}

.tt-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 2px;
}

.tt-label { color: var(--muted); }
.tt-val { color: var(--accent2); }

/* ── MOVEMENT BADGES ── */
.bc-badge {
  position: absolute;
  top: 2px;
  right: 2px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 4px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 8px;
  font-weight: 700;
  line-height: 1;
  padding: 2px 3px;

  pointer-events: none;
  z-index: 2; /* lower than tooltip */
}

.bc-badge-up {
  background: rgba(0,200,100,0.20);
  border: 1px solid rgba(0,200,100,0.5);
  color: #2ddb8a;
}

.bc-badge-down {
  background: rgba(239,83,80,0.20);
  border: 1px solid rgba(239,83,80,0.5);
  color: #ef6e6b;
}

.bc-badge-new {
  background: rgba(247,201,72,0.20);
  border: 1px solid rgba(247,201,72,0.5);
  color: #f7c948;
  font-size: 7px;
  letter-spacing: 0.5px;
}

.badge-arrow {
  display: inline-block;
  width: 8px;
  height: 8px;
}

/* ── LONGTERM ── */
.longterm-header {
  border-radius: 10px; padding: 16px 20px; margin-bottom: 20px;
  background: linear-gradient(135deg, rgba(167,139,250,0.08), rgba(59,240,196,0.04));
  border: 1px solid rgba(167,139,250,0.25);
}
.longterm-header h2 { font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #a78bfa; margin-bottom: 6px; }
.longterm-header p  { font-size: 13px; color: var(--muted); font-family: 'Share Tech Mono', monospace; line-height: 1.6; }
.lt-legend {
  display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
  padding: 10px 14px; background: rgba(255,255,255,0.02);
  border: 1px solid var(--border); border-radius: 6px;
}
.lt-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: 'Share Tech Mono', monospace; color: var(--muted); }
.lt-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* ── PLAYER PAGES ── */
.player-header {
  border-radius: 10px; padding: 18px 22px; margin-bottom: 22px;
  background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  border: 1px solid var(--border);
}
.player-header h2 { font-size: 26px; font-weight: 700; letter-spacing: 2px; margin-bottom: 12px; }
.player-stats-row { display: flex; gap: 12px; flex-wrap: wrap; }
.pstat { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 6px; padding: 8px 16px; text-align: center; min-width: 80px; }
.pstat .ps-val   { font-size: 20px; font-weight: 700; font-family: 'Share Tech Mono', monospace; color: var(--accent2); }
.pstat .ps-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
.section-header  { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin: 28px 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

/* ── ACCORDIONS ── */
.gm-accordion { margin-bottom: 6px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.gm-accordion-header { display: flex; align-items: center; gap: 12px; padding: 11px 16px; background: rgba(255,255,255,0.03); cursor: pointer; user-select: none; transition: background 0.15s; }
.gm-accordion-header:hover { background: rgba(255,255,255,0.06); }
.gm-dot       { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
.gm-acc-title { font-size: 15px; font-weight: 700; letter-spacing: 1px; flex: 1; }
.gm-acc-meta  { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--muted); display: flex; gap: 14px; }
.gm-acc-wr    { font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: rgba(0,0,0,0.3); min-width: 42px; text-align: center; }
.gm-acc-arrow { font-size: 11px; color: var(--muted); transition: transform 0.2s; margin-left: 6px; }
.gm-accordion.open .gm-acc-arrow { transform: rotate(90deg); }
.gm-accordion-body { display: none; border-top: 1px solid var(--border); }
.gm-accordion.open .gm-accordion-body { display: block; }
.map-group { border-bottom: 1px solid rgba(255,255,255,0.04); }
.map-group:last-child { border-bottom: none; }
.map-group-header { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 38px; background: rgba(0,0,0,0.2); cursor: pointer; user-select: none; transition: background 0.15s; }
.map-group-header:hover { background: rgba(255,255,255,0.04); }
.map-group-name   { flex: 1; color: var(--text); font-size: 13px; font-weight: 600; }
.map-group-record { font-family: 'Share Tech Mono', monospace; font-size: 11px; display: flex; gap: 6px; align-items: center; }
.map-group-arrow  { font-size: 10px; color: var(--muted); transition: transform 0.2s; margin-left: 8px; }
.map-group.open .map-group-arrow { transform: rotate(90deg); }
.map-group-body { display: none; }
.map-group.open .map-group-body { display: block; }
.brawler-result-row { display: flex; align-items: center; gap: 10px; padding: 7px 16px 7px 52px; border-top: 1px solid rgba(255,255,255,0.03); font-size: 13px; transition: background 0.1s; }
.brawler-result-row:hover { background: rgba(255,255,255,0.03); }
.brr-img  { width: 26px; height: 26px; border-radius: 4px; object-fit: cover; background: #1a1f3a; flex-shrink: 0; }
.brr-name { font-weight: 700; flex: 1; }
.brr-record { font-family: 'Share Tech Mono', monospace; font-size: 12px; }
.brr-win  { color: #4caf50; }
.brr-loss { color: #ef5350; }
.brr-wr   { font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: rgba(0,0,0,0.3); min-width: 42px; text-align: center; }
.wr-high { color: #4caf50; }
.wr-mid  { color: var(--accent); }
.wr-low  { color: #ef5350; }
.gm-empty { padding: 10px 16px; font-size: 12px; color: var(--muted); font-family: 'Share Tech Mono', monospace; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">BRAWL<span>STATS</span></div>
  <div class="last-updated">LAST UPDATED <span id="last-updated-date">—</span></div>
</div>

<!-- PRIMARY NAV -->
<div class="primary-nav">
  <div class="primary-tab active" data-primary="meta"  onclick="switchPrimary('meta')">⚡ META</div>
  <div class="primary-tab"        data-primary="users" onclick="switchPrimary('users')">👥 USERS</div>
</div>

<!-- SECONDARY NAV — META -->
<div class="secondary-nav visible" id="secondary-meta">
  <div class="secondary-tab active" data-sub="pro"        onclick="switchSub('meta','pro')">
    <div class="tab-pip" style="background:#f7c948"></div>PRO META
  </div>
  <div class="secondary-tab"        data-sub="longterm"   onclick="switchSub('meta','longterm')">
    <div class="tab-pip" style="background:#a78bfa"></div>PAST 6 MONTHS
  </div>
  <div class="secondary-tab"        data-sub="gamemodes"  onclick="switchSub('meta','gamemodes')">
    <div class="tab-pip" style="background:#fb923c"></div>GAME MODES
  </div>
</div>

<!-- SECONDARY NAV — USERS -->
<div class="secondary-nav" id="secondary-users">
  <div class="secondary-tab" data-sub="jasper" onclick="switchSub('users','jasper')"><div class="tab-pip" style="background:#ff6ec7"></div>JASPER</div>
  <div class="secondary-tab" data-sub="daniel" onclick="switchSub('users','daniel')"><div class="tab-pip" style="background:#64b5f6"></div>DANIEL</div>
  <div class="secondary-tab" data-sub="wolf"   onclick="switchSub('users','wolf')"  ><div class="tab-pip" style="background:#ffb74d"></div>WOLF</div>
  <div class="secondary-tab" data-sub="tykoro" onclick="switchSub('users','tykoro')"><div class="tab-pip" style="background:#81c784"></div>TYKORO</div>
  <div class="secondary-tab" data-sub="sirito" onclick="switchSub('users','sirito')"><div class="tab-pip" style="background:#ce93d8"></div>SIRITO</div>
</div>

<!-- PAGES -->
<div class="page active" id="page-pro"><div id="pro-tier-list"></div></div>
<div class="page" id="page-longterm"><div id="longterm-content"></div></div>
<div class="page" id="page-gamemodes"><div id="gamemodes-content"></div></div>
<div class="page" id="page-jasper"><div id="jasper-content"></div></div>
<div class="page" id="page-daniel"><div id="daniel-content"></div></div>
<div class="page" id="page-wolf"><div id="wolf-content"></div></div>
<div class="page" id="page-tykoro"><div id="tykoro-content"></div></div>
<div class="page" id="page-sirito"><div id="sirito-content"></div></div>

<script>
const LAST_UPDATED = '2026-04-11: 17:52';

// ─── NAV ─────────────────────────────────────────────────────────────────────
let currentPrimary = 'meta';
const primaryDefaults = { meta: 'pro', users: 'jasper' };

function switchPrimary(primary) {
  currentPrimary = primary;
  document.querySelectorAll('.primary-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-primary="${primary}"]`).classList.add('active');
  document.getElementById('secondary-meta').classList.toggle('visible', primary === 'meta');
  document.getElementById('secondary-users').classList.toggle('visible', primary === 'users');
  switchSub(primary, primaryDefaults[primary]);
}

function switchSub(primary, sub) {
  primaryDefaults[primary] = sub;
  document.querySelectorAll('.secondary-tab').forEach(t => t.classList.remove('active'));
  const btn = document.querySelector(`[data-sub="${sub}"]`);
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + sub).classList.add('active');
}

  A: ['FRANK', 'MINA', 'BYRON', 'OTIS', 'RICO', 'MORTIS', 'KAZE', 'ANGELO', 'SHELLY', 'POCO', 'GUS', 'FINX', 'AMBER', 'CHESTER', 'KENJI', 'NITA'],

  C: ['MELODIE', 'STU', 'PAM', 'GALE', 'LARRY & LAWRIE', 'HANK', 'PIPER', 'TRUNK', 'BUSTER', 'PENNY', 'BERRY', '8-BIT', 'MEG', 'BARLEY', 'OLLIE', 'GRIFF', 'MANDY', 'TICK', 'BUZZ', 'MAISIE', 'EVE', 'DRACO', 'LOLA', 'SPROUT', 'ASH', 'DYNAMIKE', 'PEARL'],

};

const LONGTERM_TIERS = {
  S: ['OTIS', 'MINA', 'MEEPLE', 'MORTIS', 'CROW'],

  { brawler: 'RICO', gamemode: 'knockout', map: "Flaring Phoenix:::", wins: 0, losses: 1 },
  { brawler: 'SHELLY', gamemode: 'brawlBall', map: "Triple Dribble:::", wins: 0, losses: 1 },
  { brawler: 'SPIKE', gamemode: 'heist', map: "Kaboom Canyon:::", wins: 0, losses: 1 },
  { brawler: 'SQUEAK', gamemode: 'bounty', map: "Layer Cake:", wins: 1, losses: 0 },
  { brawler: 'SQUEAK', gamemode: 'bounty', map: "Layer Cake::", wins: 1, losses: 0 },
  { brawler: 'SQUEAK', gamemode: 'hotZone', map: "Dueling Beetles:::", wins: 1, losses: 0 },
]},
};

const GM_COLORS = {bounty:'#f44336',brawlBall:'#4caf50',gemGrab:'#9c27b0',heist:'#ff9800',hotZone:'#f06292',knockout:'#29b6f6'};
const GM_LABELS = {bounty:'Bounty',brawlBall:'Brawl Ball',gemGrab:'Gem Grab',heist:'Heist',hotZone:'Hot Zone',knockout:'Knockout'};
const GM_ORDER  = ['bounty','brawlBall','gemGrab','heist','hotZone','knockout'];
const TIER_KEYS = ['S','A','B','C','D','F'];
const TIER_ORDER = ['S','A','B','C','D','F'];

function portraitUrl(n) { return 'portraits/' + n.toLowerCase() + '_portrait.jpg'; }
function wrClass(r) { return r >= 0.55 ? 'wr-high' : r >= 0.45 ? 'wr-mid' : 'wr-low'; }
function score(sets, wins) { if (sets < 1 || wins === 0) return sets < 1 ? null : 0; return Math.pow(sets,0.7)*Math.pow(wins/sets,0.3); }

function buildTierMap(tiers) {
  const m = {};
  for (const [t,ns] of Object.entries(tiers)) for (const n of ns) m[n] = t;
  return m;
}
function getMovement(name, currentTier) {
  const prev = buildTierMap(PREV_LIST);
  if (!prev[name]) return 'new';
  if (prev[name] === currentTier) return null;
  return TIER_ORDER.indexOf(currentTier) < TIER_ORDER.indexOf(prev[name]) ? 'up' : 'down';
}
function badgeHTML(mv) {
  if (!mv) return '';
  if (mv==='up')   return `<div class="bc-badge bc-badge-up"><svg class="badge-arrow" viewBox="0 0 8 8" fill="none"><path d="M4 7V1M4 1L1.5 3.5M4 1L6.5 3.5" stroke="#2ddb8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
  if (mv==='down') return `<div class="bc-badge bc-badge-down"><svg class="badge-arrow" viewBox="0 0 8 8" fill="none"><path d="M4 1V7M4 7L1.5 4.5M4 7L6.5 4.5" stroke="#ef6e6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
  if (mv==='new')  return `<div class="bc-badge bc-badge-new">NEW</div>`;
  return '';
}

function buildProStatsMap() {
  const m = new Map();
  for (const b of PRO_DATA) {
    let sets=0,wins=0;
    for (const gm of GM_ORDER) { if (b[gm]) { sets+=b[gm][0]; wins+=b[gm][1]; } }
    m.set(b.brawler, {sets, wins});
  }
  return m;
}

function renderTierRows(container, tiersObj, opts={}) {
  const {badges=false, longTermTrend=false, gamemodeKey=null} = opts;
  const stats = buildProStatsMap();
  const prevMap = buildTierMap(PREV_LIST);
  const currMap = buildTierMap(PRO_MANUAL_TIERS);
  const noData = gamemodeKey && (gamemodeKey === 'soloShowdown' || gamemodeKey === 'brawlArena');

  for (const tk of TIER_KEYS) {
    const names = tiersObj[tk] || [];
    const row = document.createElement('div');
    row.className = 'tier-row';
    row.innerHTML = `<div class="tier-label tier-${tk}">${tk}</div>`;
    const inner = document.createElement('div');
    inner.className = 'tier-brawlers';
    if (!names.length) { inner.innerHTML = '<span class="empty-tier">—</span>'; }
    else {
      for (const name of names) {
        let wrStr = '—', setsStr = '—';
        if (!noData && gamemodeKey) {
          const row = PRO_DATA.find(b => b.brawler === name);
          const gd = row && row[gamemodeKey];
          if (gd) { setsStr = gd[0]; wrStr = (gd[1]/gd[0]*100).toFixed(1)+'%'; }
        } else if (!gamemodeKey) {
          const s = stats.get(name) || {sets:0,wins:0};
          setsStr = s.sets;
          wrStr = s.sets > 0 ? (s.wins/s.sets*100).toFixed(1)+'%' : '—';
        }
        const mv = badges ? getMovement(name, tk) : null;
        let extra = '';
        if (badges) {
          const prev = prevMap[name]||'—';
          const label = mv==='up' ? `↑ Up from ${prev}` : mv==='down' ? `↓ Down from ${prev}` : mv==='new' ? '✦ New' : 'Stable';
          extra = `<div class="tt-row"><span class="tt-label">Change</span><span class="tt-val">${label}</span></div>`;
        }
        if (longTermTrend) {
          const ct = currMap[name]; let note='Not in current list', col='var(--muted)';
          if (ct) {
            const li=TIER_ORDER.indexOf(tk), ci=TIER_ORDER.indexOf(ct);
            if (ci<li){note=`↑ Rising (now ${ct})`;col='#2ddb8a';}
            else if(ci>li){note=`↓ Falling (now ${ct})`;col='#ef6e6b';}
            else{note=`Stable at ${ct}`;}
          }
          extra = `<div class="tt-row"><span class="tt-label">Trend</span><span class="tt-val" style="color:${col}">${note}</span></div>`;
        }
        const statsRows = noData ? '' : `
          <div class="tt-row"><span class="tt-label">Win Rate</span><span class="tt-val">${wrStr}</span></div>
          <div class="tt-row"><span class="tt-label">Sets</span><span class="tt-val">${setsStr}</span></div>`;
        inner.innerHTML += `<a class="brawler-card" href="pages/${name.toLowerCase()}.html" style="text-decoration:none">
          ${badgeHTML(mv)}
          <img src="${portraitUrl(name)}" alt="${name}" onerror="this.style.background='#1a1f3a'">
          <div class="bc-name">${name}</div>
          <div class="bc-tooltip">
            <div class="tt-name">${name}</div>
            ${statsRows}
            ${extra}
          </div>
        </a>`;
      }
    }
    row.appendChild(inner);
    container.appendChild(row);
  }
}

// ── PRO TIER LIST ──
function buildProTierList() {
  const stats = buildProStatsMap();
  const container = document.getElementById('pro-tier-list');
  container.innerHTML = '';
  renderTierRows(container, PRO_MANUAL_TIERS, {badges: true});
  // unranked
  const placed = new Set(Object.values(PRO_MANUAL_TIERS).flat());
  const unranked = PRO_DATA.filter(b => !placed.has(b.brawler));
  if (unranked.length) {
    const urow = document.createElement('div');
    urow.className = 'tier-row';
    const ul = document.createElement('div');
    ul.className = 'tier-label tier-unranked';
    ul.innerHTML = 'UNRANKED<br>/NO DATA';
    urow.appendChild(ul);
    const ui = document.createElement('div'); ui.className = 'tier-brawlers';
    for (const b of unranked) {
      const s = stats.get(b.brawler)||{sets:0,wins:0};
      const wr = s.sets>0?(s.wins/s.sets*100).toFixed(1)+'%':'—';
      ui.innerHTML += `<a class="brawler-card" href="pages/${b.brawler.toLowerCase()}.html" style="text-decoration:none;opacity:0.45">
        <img src="${portraitUrl(b.brawler)}" alt="${b.brawler}" onerror="this.style.background='#1a1f3a'">
        <div class="bc-name">${b.brawler}</div>
        <div class="bc-tooltip"><div class="tt-name">${b.brawler}</div>
          <div class="tt-row"><span class="tt-label">Win Rate</span><span class="tt-val">${wr}</span></div></div>
      </a>`;
    }
    urow.appendChild(ui); container.appendChild(urow);
  }
}

// ── LONGTERM ──
function buildLongtermPage() {
  const c = document.getElementById('longterm-content');
  c.innerHTML = `<div class="longterm-header"><h2>PAST 6 MONTHS — META OVERVIEW</h2>
    <p>Sustained performance across all patches. Ranked on consistency, not just current patch.</p></div>
    <div class="lt-legend">
      <div class="lt-legend-item"><div class="lt-dot" style="background:#ff4e50"></div>S — Always meta</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#ff9800"></div>A — Consistently meta</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#ffeb3b"></div>B — Often Good</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#8bc34a"></div>C — Situational</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#29b6f6"></div>D — Rarely viable</div>
      <div class="lt-legend-item"><div class="lt-dot" style="background:#9e9e9e"></div>F — Not viable</div>
    </div>`;
  const wrap = document.createElement('div');
  renderTierRows(wrap, LONGTERM_TIERS, {longTermTrend: true});
  c.appendChild(wrap);
}

// ── GAMEMODES ──
function buildGamemodesPage() {
  const c = document.getElementById('gamemodes-content');
c.innerHTML = `<div class="longterm-header"><h2>GAMEMODES — META OVERVIEW</h2>
<p>This list highlights the strongest brawlers for each gamemode. It doesn’t include every brawler. Only the ones that are consistently viable. Brawlers shown here significantly outperform those not listed, so picking outside this list is generally not recommended.</p></div>

<div class="lt-legend">
  <div class="lt-legend-item"><div class="lt-dot" style="background:#ff4e50"></div>S — Overpowered</div>
  <div class="lt-legend-item"><div class="lt-dot" style="background:#ff9800"></div>A — Top Tier</div>
  <div class="lt-legend-item"><div class="lt-dot" style="background:#ffeb3b"></div>B — Strong Picks</div>
  <div class="lt-legend-item"><div class="lt-dot" style="background:#8bc34a"></div>C — Solid</div>
  <div class="lt-legend-item"><div class="lt-dot" style="background:#29b6f6"></div>D — Niche</div>
  <div class="lt-legend-item"><div class="lt-dot" style="background:#9e9e9e"></div>F — Very Niche</div>
</div>`;
  const bar = document.createElement('div');
  bar.className = 'gm-switcher';

  GM_SWITCHER_ORDER.forEach((key, i) => {
    const gm = GAMEMODE_TIERS[key];
    const btn = document.createElement('div');
    btn.className = 'gm-switch-btn' + (i===0?' active':'');
    if (i===0) { btn.style.background=gm.color+'22'; btn.style.borderColor=gm.color+'66'; btn.style.color=gm.color; }
    btn.innerHTML = `
  <span class="gm-switch-icon">
    <img src="${gm.icon}" alt="${gm.label}" />
  </span>
`;
    btn.onclick = () => {
      document.querySelectorAll('.gm-switch-btn').forEach(b => { b.classList.remove('active'); b.style.background=''; b.style.borderColor=''; b.style.color=''; });
      btn.classList.add('active');
      btn.style.background = gm.color+'22';
      btn.style.borderColor = gm.color+'66';
      btn.style.color = gm.color;
      document.querySelectorAll('.gm-tier-section').forEach(s => s.classList.remove('active'));
      document.getElementById('gms-'+key).classList.add('active');
    };
    bar.appendChild(btn);
  });
  c.appendChild(bar);

  GM_SWITCHER_ORDER.forEach((key, i) => {
    const gm = GAMEMODE_TIERS[key];
    const sec = document.createElement('div');
    sec.className = 'gm-tier-section'+(i===0?' active':'');
    sec.id = 'gms-'+key;
    const hdr = document.createElement('div');
    hdr.className = 'gm-section-header';
    hdr.innerHTML = `<div class="gm-section-dot" style="background:${gm.color}"></div>${gm.label.toUpperCase()} TIER LIST`;
    sec.appendChild(hdr);
    renderTierRows(sec, gm, {gamemodeKey: key});
    c.appendChild(sec);
  });
}

// ── PLAYER PAGES ──
function buildPlayerPage(id) {
  const p = PLAYERS[id];
  const c = document.getElementById(id+'-content');
  c.innerHTML = '';
  const tw = p.matches.reduce((s,m)=>s+m.wins,0);
  const tl = p.matches.reduce((s,m)=>s+m.losses,0);
  const ts = tw+tl;
  const wr = ts>0?(tw/ts*100).toFixed(1):'—';
  const wrc = ts>0?wrClass(tw/ts):'';
  const hdr = document.createElement('div');
  hdr.className='player-header'; hdr.style.borderColor=p.color+'44';
  hdr.innerHTML=`<h2 style="color:${p.color}">${p.name}</h2>
    <div class="player-stats-row">
      <div class="pstat"><div class="ps-val" style="color:${p.color}">${ts}</div><div class="ps-label">Total Sets</div></div>
      <div class="pstat"><div class="ps-val">${tw}</div><div class="ps-label">Wins</div></div>
      <div class="pstat"><div class="ps-val" style="color:#ef5350">${tl}</div><div class="ps-label">Losses</div></div>
      <div class="pstat"><div class="ps-val ${wrc}">${wr}${ts>0?'%':''}</div><div class="ps-label">Win Rate</div></div>
    </div>`;
  c.appendChild(hdr);

  const gh = document.createElement('div'); gh.className='section-header'; gh.textContent='Results by Game Mode & Map'; c.appendChild(gh);

  for (const gm of GM_ORDER) {
    const gms = p.matches.filter(m=>m.gamemode===gm);
    const gw=gms.reduce((s,m)=>s+m.wins,0), gl=gms.reduce((s,m)=>s+m.losses,0), gs=gw+gl;
    const gr=gs>0?gw/gs:null;
    const acc=document.createElement('div'); acc.className='gm-accordion';
    acc.innerHTML=`<div class="gm-accordion-header" onclick="toggleAcc(this)">
        <div class="gm-dot" style="background:${GM_COLORS[gm]}"></div>
        <div class="gm-acc-title">${GM_LABELS[gm]}</div>
        <div class="gm-acc-meta"><span>${gs} sets</span><span>${gw}W / ${gl}L</span></div>
        <div class="gm-acc-wr ${gr!==null?wrClass(gr):''}">${gr!==null?(gr*100).toFixed(0)+'%':'—'}</div>
        <div class="gm-acc-arrow">▶</div>
      </div><div class="gm-accordion-body"></div>`;
    const body=acc.querySelector('.gm-accordion-body');
    if (!gms.length) { body.innerHTML='<div class="gm-empty">No games in this mode yet.</div>'; }
    else {
      const byMap={};
      for (const m of gms) (byMap[m.map]=byMap[m.map]||[]).push(m);
      for (const [mapName, rows] of Object.entries(byMap)) {
        const mw=rows.reduce((s,m)=>s+m.wins,0), ml=rows.reduce((s,m)=>s+m.losses,0), ms=mw+ml;
        const mr=ms>0?mw/ms:null;
        const mg=document.createElement('div'); mg.className='map-group';
        mg.innerHTML=`<div class="map-group-header" onclick="toggleMap(this)">
            <div class="map-group-name">${mapName}</div>
            <div class="map-group-record"><span style="color:#4caf50">${mw}W</span><span style="color:#ef5350">${ml}L</span><span style="color:var(--border)">·</span><span class="${mr?wrClass(mr):''}">${mr?(mr*100).toFixed(0)+'%':'—'}</span></div>
            <div class="map-group-arrow">▶</div>
          </div><div class="map-group-body"></div>`;
        const mgb=mg.querySelector('.map-group-body');
        for (const m of rows) {
          const s2=m.wins+m.losses, r2=s2>0?m.wins/s2:null;
          mgb.innerHTML+=`<div class="brawler-result-row">
            <img class="brr-img" src="${portraitUrl(m.brawler)}" alt="${m.brawler}" onerror="this.style.background='#1a1f3a'">
            <div class="brr-name">${m.brawler}</div>
            <div class="brr-record"><span class="brr-win">${m.wins}W</span> <span class="brr-loss">${m.losses}L</span></div>
            <div class="brr-wr ${r2?wrClass(r2):''}">${r2?(r2*100).toFixed(0)+'%':'—'}</div>
          </div>`;
        }
        body.appendChild(mg);
      }
    }
    c.appendChild(acc);
  }

  const th=document.createElement('div'); th.className='section-header'; th.textContent='Brawler Performance Tier List'; c.appendChild(th);
  const bAgg={};
  for (const m of p.matches) { if(!bAgg[m.brawler]) bAgg[m.brawler]={wins:0,losses:0}; bAgg[m.brawler].wins+=m.wins; bAgg[m.brawler].losses+=m.losses; }
  const scored=[], unr=[];
  for (const [name,d] of Object.entries(bAgg)) {
    const sets=d.wins+d.losses, sc=sets>=3?score(sets,d.wins):null;
    if(sc!==null) scored.push({name,sets,wins:d.wins,score:sc});
    else unr.push({name,sets,wins:d.wins,score:0});
  }
  const tdefs=[{key:'S',pct:.10},{key:'A',pct:.25},{key:'B',pct:.50},{key:'C',pct:.75},{key:'D',pct:.90},{key:'F',pct:1}];
  const bkts={}; for(const t of tdefs) bkts[t.key]=[];
  scored.sort((a,b)=>b.score-a.score);
  scored.forEach((b,i)=>{ const pct=(i+1)/scored.length; bkts[tdefs.find(t=>pct<=t.pct).key].push(b); });
  const wrap=document.createElement('div');
  for(const t of tdefs) {
    const row=document.createElement('div'); row.className='tier-row';
    row.innerHTML=`<div class="tier-label tier-${t.key}">${t.key}</div>`;
    const inner=document.createElement('div'); inner.className='tier-brawlers';
    if(!bkts[t.key].length){inner.innerHTML='<span class="empty-tier">—</span>';}
    else for(const b of bkts[t.key]) {
      const wr=(b.wins/b.sets*100).toFixed(1);
      inner.innerHTML+=`<div class="brawler-card"><img src="${portraitUrl(b.name)}" alt="${b.name}" onerror="this.style.background='#1a1f3a'">
        <div class="bc-name">${b.name}</div><div class="bc-score">${b.score.toFixed(2)}</div>
        <div class="bc-tooltip"><div class="tt-name">${b.name}</div>
          <div class="tt-row"><span class="tt-label">Win Rate</span><span class="tt-val">${wr}%</span></div>
          <div class="tt-row"><span class="tt-label">Sets</span><span class="tt-val">${b.sets}</span></div>
          <div class="tt-row"><span class="tt-label">Score</span><span class="tt-val">${b.score.toFixed(2)}</span></div>
        </div></div>`;
    }
    row.appendChild(inner); wrap.appendChild(row);
  }
  if(unr.length){
    const urow=document.createElement('div'); urow.className='tier-row';
    const ul=document.createElement('div'); ul.className='tier-label tier-unranked'; ul.innerHTML='UNRANKED<br>/NO DATA';
    urow.appendChild(ul);
    const ui=document.createElement('div'); ui.className='tier-brawlers';
    for(const b of unr){
      const wr=b.sets>0?(b.wins/b.sets*100).toFixed(1)+'%':'—';
      ui.innerHTML+=`<div class="brawler-card" style="opacity:0.45"><img src="${portraitUrl(b.name)}" alt="${b.name}" onerror="this.style.background='#1a1f3a'">
        <div class="bc-name">${b.name}</div><div class="bc-score">${b.sets>0?b.sets+'s':'—'}</div>
        <div class="bc-tooltip"><div class="tt-name">${b.name}</div>
          <div class="tt-row"><span class="tt-label">Win Rate</span><span class="tt-val">${wr}</span></div>
          <div class="tt-row"><span class="tt-label">Sets</span><span class="tt-val">${b.sets} (min 3)</span></div>
        </div></div>`;
    }
    urow.appendChild(ui); wrap.appendChild(urow);
  }
  c.appendChild(wrap);
}

function toggleAcc(h) { h.closest('.gm-accordion').classList.toggle('open'); }
function toggleMap(h) { h.closest('.map-group').classList.toggle('open'); }

document.getElementById('last-updated-date').textContent = LAST_UPDATED;
buildProTierList();
buildLongtermPage();
buildGamemodesPage();
for (const id of Object.keys(PLAYERS)) buildPlayerPage(id);
const floatingTip = document.createElement('div');
floatingTip.className = 'bc-tooltip';
floatingTip.style.display = 'none';
floatingTip.style.position = 'fixed';
document.body.appendChild(floatingTip);

document.addEventListener('mouseover', e => {
  const card = e.target.closest('.brawler-card');
  if (!card) { floatingTip.style.display = 'none'; return; }
  const tip = card.querySelector('.bc-tooltip');
  if (!tip) return;
  floatingTip.innerHTML = tip.innerHTML;
  floatingTip.style.display = 'block';
  positionTip(e, floatingTip);
});

document.addEventListener('mouseout', e => {
  const card = e.target.closest('.brawler-card');
  if (!card) return;
  if (!e.relatedTarget || !e.relatedTarget.closest('.brawler-card')) {
    floatingTip.style.display = 'none';
  }
});

document.addEventListener('mousemove', e => {
  if (floatingTip.style.display === 'block') positionTip(e, floatingTip);
});

function positionTip(e, tip) {
  const tw = tip.offsetWidth;
  const th = tip.offsetHeight;
  let left = e.clientX + 12;
  let top  = e.clientY + 12;
  if (left + tw > window.innerWidth)  left = e.clientX - tw - 8;
  if (top  + th > window.innerHeight) top  = e.clientY - th - 8;
  tip.style.left = left + 'px';
  tip.style.top  = top  + 'px';
}
</script>
